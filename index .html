<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic-Tac-Toe</title>

<style>
:root {
  --bg: #090f20;
  --panel: #111d36;
  --line: #254bba;
  --blue: #20a9ff;
  --pink: #ff4db5;
  --text: #f6f7ff;
  --muted: #a9b9d7;
  --green: #00c99a;
  --purple: #852cff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 28px 16px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(
    ellipse at top,
    #19264d 0%,
    #0b1228 48%,
    #070b17 100%
  );
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

.app {
  width: min(100%, 640px);
  text-align: center;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.title {
  font-size: clamp(2rem, 7vw, 3.3rem);
  font-weight: 750;
  letter-spacing: -1.4px;
  margin: 0;
  text-align: left;
}

.title span {
  background: linear-gradient(90deg, #8b5cf6, #d16cff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.theme-btn {
  flex-shrink: 0;
  border: 1px solid #203d82;
  background: #142442;
  color: var(--text);
  border-radius: 999px;
  padding: 10px 16px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
}

.subtitle {
  margin: 8px 0 22px;
  color: var(--muted);
  font-size: clamp(1rem, 3.6vw, 1.35rem);
  text-align: left;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  margin-bottom: 16px;
}

.control {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #142442;
  border: 1px solid #203d82;
  border-radius: 14px;
  padding: 10px 12px;
  font-size: 0.95rem;
  font-weight: 700;
}

.control select {
  border: 1px solid #254bba;
  border-radius: 10px;
  padding: 7px 9px;
  font-size: 0.95rem;
  font-weight: 700;
  background: #0b1228;
  color: var(--text);
  cursor: pointer;
}

.control select:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.scoreboard {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 16px;
}

.score-chip {
  border: 1px solid #203d82;
  background: #142442;
  border-radius: 999px;
  padding: 7px 13px;
  font-size: 0.92rem;
  font-weight: 700;
}

.score-chip.active {
  border-width: 2px;
  box-shadow: 0 0 14px #287dff33;
}

.score-chip .draws {
  color: var(--muted);
}

.status {
  padding: 19px 14px;
  border: 1px solid #203d82;
  background: linear-gradient(110deg, #142442, #172342);
  border-radius: 21px;
  font-size: clamp(1.15rem, 4.5vw, 1.6rem);
  margin-bottom: 18px;
  box-shadow: 0 8px 25px #0002;
}

.board-wrap {
  padding: clamp(14px, 4vw, 24px);
  background: linear-gradient(145deg, #14213d, #101a32);
  border: 1px solid #1e3472;
  border-radius: 26px;
  box-shadow: 0 16px 40px #0003;
}

.board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  max-width: 410px;
  margin: auto;
}

.cell {
  aspect-ratio: 1;
  min-width: 0;
  border: 2px solid #244db8;
  border-radius: 15px;
  background: linear-gradient(145deg, #1a2b49, #17233b);
  color: white;
  font-size: clamp(2rem, 11vw, 4.2rem);
  font-weight: 700;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: background .15s, transform .15s, box-shadow .15s;
}

.cell:hover:not(:disabled) {
  background: #24395d;
  transform: translateY(-2px);
  box-shadow: 0 0 18px #287dff25;
}

.cell:disabled {
  cursor: default;
}

.cell.p0 { color: #20a9ff; text-shadow: 0 0 18px #168eff55; }
.cell.p1 { color: #ff4db5; text-shadow: 0 0 18px #ff4db555; }
.cell.p2 { color: #00c99a; text-shadow: 0 0 18px #00c99a55; }
.cell.p3 { color: #b678ff; text-shadow: 0 0 18px #852cff55; }
.cell.p4 { color: #ffb020; text-shadow: 0 0 18px #ffb02055; }
.cell.p5 { color: #00d8e0; text-shadow: 0 0 18px #00d8e055; }

.cell.winner {
  background: #163f4c;
  border-color: #00d8b0;
  box-shadow: 0 0 20px #00d8b033;
}

.buttons {
  display: flex;
  gap: 14px;
  justify-content: center;
  margin-top: 25px;
  flex-wrap: wrap;
}

.btn {
  border: 1px solid transparent;
  border-radius: 16px;
  padding: 15px 22px;
  min-width: 0;
  font-size: clamp(.95rem, 3.3vw, 1.15rem);
  font-weight: 750;
  cursor: pointer;
  color: white;
  box-shadow: 0 8px 20px #0003;
}

.restart {
  background: linear-gradient(120deg, #00bd91, #00a887);
  border-color: #00edbd;
}

.undo {
  background: linear-gradient(120deg, #913cff, #6c20e9);
  border-color: #ae75ff;
}

.reset-scores {
  background: linear-gradient(120deg, #3b82f6, #254bba);
  border-color: #60a5fa;
}

.btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.btn:focus-visible,
.cell:focus-visible,
.theme-btn:focus-visible,
.control select:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 3px;
}

.info {
  color: var(--muted);
  font-size: .88rem;
  line-height: 1.55;
  margin: 20px 0 0;
}

/* ---------- Light mode ---------- */
body[data-theme="light"] {
  background: linear-gradient(180deg, #eef2ff 0%, #dbeafe 55%, #f8fafc 100%);
  color: #16203a;
}

body[data-theme="light"] .theme-btn,
body[data-theme="light"] .control,
body[data-theme="light"] .score-chip {
  background: #ffffff;
  border-color: #c7d2fe;
  color: #16203a;
}

body[data-theme="light"] .control select {
  background: #f1f5ff;
  border-color: #aab8dd;
  color: #16203a;
}

body[data-theme="light"] .subtitle,
body[data-theme="light"] .info,
body[data-theme="light"] .score-chip .draws {
  color: #5a6b8f;
}

body[data-theme="light"] .status {
  background: #ffffff;
  border-color: #c7d2fe;
  color: #16203a;
  box-shadow: 0 8px 25px #0001;
}

body[data-theme="light"] .board-wrap {
  background: #ffffff;
  border-color: #dbe2f0;
  box-shadow: 0 16px 40px #0001;
}

body[data-theme="light"] .cell {
  background: #f1f5ff;
  border-color: #aab8dd;
}

body[data-theme="light"] .cell:hover:not(:disabled) {
  background: #e2eaff;
}

body[data-theme="light"] .cell.winner {
  background: #d1fae5;
  border-color: #00a887;
}

@media (max-width: 420px) {
  body {
    padding: 22px 12px;
  }

  .buttons {
    gap: 9px;
  }

  .btn {
    padding: 14px 13px;
    flex: 1;
  }

  .cell {
    border-radius: 11px;
  }

  .status {
    padding: 16px 10px;
  }
}
</style>
</head>

<body>

<main class="app">

  <div class="topbar">
    <h1 class="title">
      <span>Tic-Tac-Toe</span>
    </h1>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle dark and light mode">
      ☀️ Light
    </button>
  </div>

  <p class="subtitle">Beginner-friendly learning activity</p>

  <div class="controls">
    <label class="control">
      Mode
      <select id="modeSelect" aria-label="Game mode">
        <option value="single">1 Player vs Computer</option>
        <option value="multi" selected>Multiplayer</option>
      </select>
    </label>

    <label class="control">
      Players
      <select id="playerCountSelect" aria-label="Number of players">
        <option value="2" selected>2 Players</option>
        <option value="3">3 Players</option>
        <option value="4">4 Players</option>
        <option value="5">5 Players</option>
        <option value="6">6 Players</option>
      </select>
    </label>
  </div>

  <div class="scoreboard" id="scoreboard" aria-live="polite"></div>

  <div class="status" id="status" aria-live="polite"></div>

  <div class="board-wrap">
    <div
      class="board"
      id="board"
      role="group"
      aria-label="Tic-Tac-Toe game board">
    </div>
  </div>

  <div class="buttons">
    <button class="btn restart" id="restart">
      ⟳ &nbsp; Restart Game
    </button>

    <button class="btn undo" id="undo">
      ↶ &nbsp; Undo
    </button>

    <button class="btn reset-scores" id="resetScores">
      Reset Scores
    </button>
  </div>

  <p class="info" id="info">
    Take turns placing your symbol. Get three in a row to win.
    In 1-player mode you play X and the computer plays O.
    In multiplayer, players take turns on the same device.
  </p>

</main>

<script>
// ---------- Players: symbol + colour for up to 6 players ----------
const PLAYERS = [
  { symbol: 'X', color: '#20a9ff', name: 'Player 1' },
  { symbol: 'O', color: '#ff4db5', name: 'Player 2' },
  { symbol: '▲', color: '#00c99a', name: 'Player 3' },
  { symbol: '■', color: '#b678ff', name: 'Player 4' },
  { symbol: '★', color: '#ffb020', name: 'Player 5' },
  { symbol: '◆', color: '#00d8e0', name: 'Player 6' }
];

let mode = 'multi'; // 'single' = 1 player vs computer, 'multi' = 2-6 players
let playerCount = 2;
let squares = Array(9).fill(null); // each entry is a player index (0-5) or null
let current = 0; // index of player whose turn it is
let history = [];
let scores = Array(6).fill(0);
let draws = 0;
let scoredGame = false; // so a finished game is only counted once
let computerTimer = null;

const board = document.getElementById('board');
const status = document.getElementById('status');
const scoreboard = document.getElementById('scoreboard');
const undoBtn = document.getElementById('undo');
const modeSelect = document.getElementById('modeSelect');
const playerCountSelect = document.getElementById('playerCountSelect');
const themeBtn = document.getElementById('themeBtn');

const wins = [
  [0, 1, 2],
  [3, 4, 5],
  [6, 7, 8],
  [0, 3, 6],
  [1, 4, 7],
  [2, 5, 8],
  [0, 4, 8],
  [2, 4, 6]
];

function activePlayerCount() {
  return mode === 'single' ? 2 : playerCount;
}

function playerLabel(i) {
  if (mode === 'single') {
    return i === 0 ? 'You (X)' : 'Computer (O)';
  }
  return PLAYERS[i].name + ' (' + PLAYERS[i].symbol + ')';
}

function winningLine() {
  for (const line of wins) {
    if (
      squares[line[0]] !== null &&
      squares[line[0]] === squares[line[1]] &&
      squares[line[1]] === squares[line[2]]
    ) {
      return line;
    }
  }
  return null;
}

function isGameOver() {
  return !!winningLine() || squares.every((v) => v !== null);
}

function countScore() {
  if (scoredGame) return;
  scoredGame = true;
  const line = winningLine();
  if (line) {
    scores[squares[line[0]]] += 1;
  } else if (squares.every((v) => v !== null)) {
    draws += 1;
  }
}

function renderScoreboard() {
  const count = activePlayerCount();
  let html = '';
  for (let i = 0; i < count; i++) {
    html += '<span class="score-chip' + (i === current && !isGameOver() ? ' active' : '') + '" style="color:' + PLAYERS[i].color + '">' +
      playerLabel(i) + ': ' + scores[i] + '</span>';
  }
  html += '<span class="score-chip"><span class="draws">Draws: ' + draws + '</span></span>';
  scoreboard.innerHTML = html;
}

function render() {
  const line = winningLine();
  const winner = line ? squares[line[0]] : null;

  if (winner !== null) {
    countScore();
    status.innerHTML = 'Winner: <strong style="color:' + PLAYERS[winner].color + '">' +
      playerLabel(winner) + '</strong> 🎉';
  } else if (squares.every((v) => v !== null)) {
    countScore();
    status.textContent = 'It’s a draw!';
  } else if (mode === 'single' && current === 1) {
    status.innerHTML = 'Computer is thinking… <strong style="color:' + PLAYERS[1].color + '">(O)</strong>';
  } else {
    status.innerHTML = 'Next Player: <strong style="color:' + PLAYERS[current].color + '">' +
      playerLabel(current) + '</strong>';
  }

  renderScoreboard();

  board.innerHTML = '';

  squares.forEach((value, i) => {
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'cell' +
      (value !== null ? ' p' + value : '') +
      (line && line.includes(i) ? ' winner' : '');
    cell.textContent = value !== null ? PLAYERS[value].symbol : '';
    cell.setAttribute(
      'aria-label',
      'Cell ' + (i + 1) + (value !== null ? ', ' + PLAYERS[value].symbol : '')
    );
    cell.disabled =
      value !== null ||
      winner !== null ||
      squares.every((v) => v !== null) ||
      (mode === 'single' && current === 1);
    cell.addEventListener('click', () => move(i));
    board.appendChild(cell);
  });

  undoBtn.disabled = history.length === 0;
}

function doMove(i) {
  history.push({ squares: [...squares], current });
  squares[i] = current;
  current = (current + 1) % activePlayerCount();
  scoredGame = false;
  render();
  maybeComputerMove();
}

function move(i) {
  if (squares[i] !== null || isGameOver()) return;
  // In single-player mode, clicks are ignored on the computer's turn.
  if (mode === 'single' && current === 1) return;
  doMove(i);
}

// ---------- Simple computer AI: win > block > centre > corner > random ----------
function findMoveFor(playerIndex) {
  for (const line of wins) {
    const values = line.map((i) => squares[i]);
    const mine = values.filter((v) => v === playerIndex).length;
    const empty = line.filter((i) => squares[i] === null);
    if (mine === 2 && empty.length === 1) return empty[0];
  }
  return -1;
}

function computerMove() {
  if (mode !== 'single' || current !== 1 || isGameOver()) return;
  let pick = findMoveFor(1); // win if possible
  if (pick === -1) pick = findMoveFor(0); // block the player
  if (pick === -1 && squares[4] === null) pick = 4; // centre
  if (pick === -1) {
    const corners = [0, 2, 6, 8].filter((i) => squares[i] === null);
    if (corners.length) pick = corners[Math.floor(Math.random() * corners.length)];
  }
  if (pick === -1) {
    const empty = squares.map((v, i) => (v === null ? i : -1)).filter((i) => i !== -1);
    if (empty.length) pick = empty[Math.floor(Math.random() * empty.length)];
  }
  if (pick !== -1) doMove(pick);
}

function maybeComputerMove() {
  if (computerTimer) clearTimeout(computerTimer);
  if (mode === 'single' && current === 1 && !isGameOver()) {
    computerTimer = setTimeout(computerMove, 450);
  }
}

function resetBoard() {
  if (computerTimer) clearTimeout(computerTimer);
  squares = Array(9).fill(null);
  current = 0;
  history = [];
  scoredGame = false;
  render();
  maybeComputerMove();
}

function syncModeControls() {
  playerCountSelect.disabled = mode === 'single';
  if (mode === 'single') {
    playerCountSelect.value = '2';
  }
}

modeSelect.addEventListener('change', () => {
  mode = modeSelect.value;
  scores = Array(6).fill(0);
  draws = 0;
  syncModeControls();
  resetBoard();
});

playerCountSelect.addEventListener('change', () => {
  playerCount = parseInt(playerCountSelect.value, 10);
  scores = Array(6).fill(0);
  draws = 0;
  resetBoard();
});

document.getElementById('restart').addEventListener('click', resetBoard);

document.getElementById('resetScores').addEventListener('click', () => {
  scores = Array(6).fill(0);
  draws = 0;
  render();
});

undoBtn.addEventListener('click', () => {
  if (computerTimer) clearTimeout(computerTimer);
  if (!history.length) return;

  // In single-player mode, undo both the computer's move and your move,
  // so it is your turn again. In multiplayer, undo just one move.
  let steps = 1;
  if (mode === 'single' && history.length >= 2) steps = 2;

  for (let s = 0; s < steps; s++) {
    const last = history.pop();
    if (!last) break;
    squares = [...last.squares];
    current = last.current;
  }
  scoredGame = false;
  // If undoing a finished game, the score counted for it stays as history;
  // the board is simply restored to an unfinished state.
  render();
});

// ---------- Dark / Light mode ----------
function applyTheme(theme) {
  document.body.setAttribute('data-theme', theme);
  themeBtn.textContent = theme === 'light' ? '🌙 Dark' : '☀️ Light';
  try { localStorage.setItem('ttt-theme', theme); } catch (e) {}
}

themeBtn.addEventListener('click', () => {
  const nextTheme = document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  applyTheme(nextTheme);
});

(function initTheme() {
  let saved = 'dark';
  try { saved = localStorage.getItem('ttt-theme') || 'dark'; } catch (e) {}
  if (saved !== 'light' && saved !== 'dark') saved = 'dark';
  applyTheme(saved);
})();

syncModeControls();
render();
</script>

</body>
</html>
